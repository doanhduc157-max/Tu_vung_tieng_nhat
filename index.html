<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Nhật - Từ vựng & Keigo</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0;
        }
        h2 { color: #2c3e50; font-size: 1.5rem; text-align: center; margin-bottom: 30px; }
        .card-container { 
            perspective: 1000px; 
            width: 320px; 
            height: 220px; 
            cursor: pointer; 
        }
        .card { 
            width: 100%; 
            height: 100%; 
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); 
            transform-style: preserve-3d; 
            position: relative; 
        }
        .card.flip { transform: rotateY(180deg); }
        .card-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card-front { background-color: #ffffff; color: #333; }
        .card-back { background-color: #2c3e50; color: white; transform: rotateY(180deg); }
        .kanji { font-size: 2.2rem; font-weight: bold; margin-bottom: 10px; }
        .romaji { font-size: 1.1rem; color: #7f8c8d; }
        .vi-meaning { font-size: 1.2rem; line-height: 1.5; }
        .controls { display: flex; gap: 15px; margin-top: 30px; }
        button { 
            padding: 10px 25px; 
            border: none; 
            border-radius: 8px; 
            background-color: #3498db; 
            color: white; 
            cursor: pointer; 
            font-size: 1rem; 
            transition: background 0.3s;
        }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <h2>Luyện Tập Từ Vựng & Kính Ngữ (Keigo)</h2>
    
    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <div class="kanji" id="jp-text">拝見する</div>
                <div class="romaji" id="reading">はいけんする (Haiken suru)</div>
            </div>
            <div class="card-face card-back">
                <div class="vi-meaning" id="vi-text">Xem, nhìn<br><br><small>(Khiêm nhường ngữ của 見る)</small></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">Trước</button>
        <button onclick="nextCard()">Tiếp theo</button>
    </div>

    <script>
        const vocab = [
            { jp: "拝見する", reading: "はいけんする", vi: "Xem, nhìn<br><br><small>(Khiêm nhường ngữ của 見る)</small>" },
            { jp: "申し上げる", reading: "もうしあげる", vi: "Nói, trình bày<br><br><small>(Khiêm nhường ngữ của 言う)</small>" },
            { jp: "伺う", reading: "うかがう", vi: "Hỏi, nghe, đến thăm<br><br><small>(Khiêm nhường ngữ)</small>" },
            { jp: "存じております", reading: "ぞんじております", vi: "Biết<br><br><small>(Khiêm nhường ngữ của 知っている)</small>" },
            { jp: "おっしゃる", reading: "おっしゃる", vi: "Nói<br><br><small>(Tôn kính ngữ của 言う)</small>" },
            { jp: "一花", reading: "いっか (Ikka)", vi: "Một bông hoa / Thành công rực rỡ" }
        ];

        let currentIndex = 0;

        function updateCard() {
            document.getElementById('jp-text').innerHTML = vocab[currentIndex].jp;
            document.getElementById('reading').innerHTML = vocab[currentIndex].reading;
            document.getElementById('vi-text').innerHTML = vocab[currentIndex].vi;
            document.getElementById('flashcard').classList.remove('flip');
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flip');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % vocab.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + vocab.length) % vocab.length;
            updateCard();
        }
    </script>
</body>
</html>
